<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/calculator.css">

</head>

<body>
    <div class="wrapper">
        <section class="screen">
            0
        </section>

        <section class="calc-buttons">
            <!-- 1st column -->
            <div class="row">
                <button class="clear-button">C </button>
                <!-- <button>&#x2190; </button> -->
                <button style="font-weight: 500;">&#8249;<span style="margin-left: -6px;">&#8211;</span> </button>
                <button>&divide; </button>
            </div>
            <!-- 2nd column -->
            <div class="row">
                <button>7 </button>
                <button>8 </button>
                <button>9 </button>
                <button>&times;</button>
            </div>
            <!-- 3rd column -->
            <div class="row">
                <button>4 </button>
                <button>5 </button>
                <button>6 </button>
                <button>&minus;</button>
            </div>
            <!-- 4th column -->
            <div class="row">
                <button>1 </button>
                <button>2 </button>
                <button>3 </button>
                <button>&plus;</button>
            </div>
            <!-- 5th column -->
            <div class="row">
                <button class="button-0">0</button>
                <button>&equals;</button>
            </div>
        </section>
    </div>

</body>

</html>
