<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Viewer</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <main class="container">
        <header>
            <h1>Dog Viewer</h1>
        </header>
    </main>

    <main class="container">
        <section class="toolbar">
            <label for="breeds-selector">Choose a breed</label>
            <select id="breeds-selector" class="selector">
                <option disabled selected> Select any one option</option>
            </select>
        </section>
    </main>

    <main class="container ">
        <section class="image-view">
            <div class="spinner spin">🖼️</div>
        </section>
    </main>
    <script src="./script.js"></script>
</body>

</html>
